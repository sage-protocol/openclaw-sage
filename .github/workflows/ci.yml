name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typecheck-and-unit-test:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: TypeScript typecheck
        run: npm run typecheck

      - name: Run unit tests (no sage binary required)
        run: node --import tsx src/mcp-bridge.test.ts

  latest-openclaw-install-check:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Build plugin tarball
        run: npm pack --json > pack.json

      - name: Verify tarball contains plugin files only
        run: |
          node -e 'const fs=require("node:fs"); const pack=JSON.parse(fs.readFileSync("pack.json","utf8"))[0]; const paths=new Set((pack.files||[]).map((f)=>f.path)); for (const path of ["package.json","openclaw.plugin.json","dist/index.js"]) { if (!paths.has(path)) throw new Error(`tarball missing ${path}`); } for (const path of ["hooks/sage-hook/HOOK.md","hooks/sage-hook/handler.ts"]) { if (paths.has(path)) throw new Error(`tarball unexpectedly contains ${path}`); } const pkg=JSON.parse(fs.readFileSync("package.json","utf8")); if (pkg.openclaw?.hooks !== undefined) throw new Error(`unexpected top-level openclaw.hooks: ${JSON.stringify(pkg.openclaw?.hooks)}`);'

      - name: Install plugin into latest OpenClaw
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          TAR_FILE=$(node -e 'const fs=require("node:fs"); process.stdout.write(JSON.parse(fs.readFileSync("pack.json","utf8"))[0].filename)')
          set -o pipefail
          npx --yes openclaw@latest plugins install "./${TAR_FILE}" 2>&1 | tee plugin-install.txt
          node -e 'const fs=require("node:fs"); const text=fs.readFileSync("plugin-install.txt","utf8"); if (/suspicious code pattern|dangerous code pattern/i.test(text)) throw new Error(`plugin install reported scan warnings:\n${text}`);'

      - name: Classify latest OpenClaw host state
        run: |
          node -e 'const fs=require("node:fs"); const text=fs.readFileSync("plugin-install.txt","utf8"); const hostCrash=/Cannot find module '\''@buape\/carbon'\''|Failed to start CLI/i.test(text); fs.appendFileSync(process.env.GITHUB_ENV, `OPENCLAW_HOST_CRASH=${hostCrash ? "1" : "0"}\n`); if (hostCrash) console.log("Detected upstream openclaw host crash while loading bundled plugins (@buape/carbon missing)");'

      - name: Verify plugin was extracted to extensions path
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          test -f "$OPENCLAW_HOME/.openclaw/extensions/openclaw-sage/package.json"
          test -f "$OPENCLAW_HOME/.openclaw/extensions/openclaw-sage/openclaw.plugin.json"
          test -f "$OPENCLAW_HOME/.openclaw/extensions/openclaw-sage/dist/index.js"
          node -e 'const fs=require("node:fs"); const root=process.env.OPENCLAW_HOME + "/.openclaw/extensions/openclaw-sage"; const pkg=JSON.parse(fs.readFileSync(root + "/package.json","utf8")); const manifest=JSON.parse(fs.readFileSync(root + "/openclaw.plugin.json","utf8")); if (pkg.name !== "@sage-protocol/openclaw-sage") throw new Error(`unexpected package name: ${pkg.name}`); if (manifest.id !== "openclaw-sage") throw new Error(`unexpected manifest id: ${manifest.id}`);'

      - name: Explicitly allow installed plugin
        if: env.OPENCLAW_HOST_CRASH != '1'
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          npx --yes openclaw@latest plugins enable openclaw-sage
          npx --yes openclaw@latest config set plugins.allow '["openclaw-sage"]' --strict-json

      - name: Verify plugin is discoverable
        if: env.OPENCLAW_HOST_CRASH != '1'
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          npx --yes openclaw@latest plugins inspect openclaw-sage --json > plugin-inspect.json
          node -e 'const fs=require("node:fs"); const data=JSON.parse(fs.readFileSync("plugin-inspect.json","utf8")); if (!data || data.plugin?.id !== "openclaw-sage") throw new Error("openclaw-sage inspect failed"); if (!String(data.plugin?.source || "").includes("dist/index.js")) throw new Error(`unexpected plugin source: ${data.plugin?.source || ""}`);'

      - name: Verify plugin-managed hooks are installed
        if: env.OPENCLAW_HOST_CRASH != '1'
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          npx --yes openclaw@latest hooks list --json > hooks-list.json
          node -e 'const fs=require("node:fs"); const hooks=JSON.parse(fs.readFileSync("hooks-list.json","utf8")).hooks || []; const pluginHooks=hooks.filter((hook)=>hook.pluginId === "openclaw-sage" && hook.managedByPlugin === true); const names=pluginHooks.map((hook)=>hook.name).sort(); const expectedNames=["sage-bootstrap-context","sage-command-new-scan","sage-command-stop-scan"].sort(); if (JSON.stringify(names)!==JSON.stringify(expectedNames)) throw new Error(`unexpected plugin-managed hook names: ${JSON.stringify(names)}`); const events=pluginHooks.flatMap((hook)=>Array.isArray(hook.events) ? hook.events : [hook.event]).filter(Boolean).sort(); const expectedEvents=["agent:bootstrap","command:new","command:stop"].sort(); if (JSON.stringify(events)!==JSON.stringify(expectedEvents)) throw new Error(`unexpected plugin-managed hook events: ${JSON.stringify(events)}`);'

      - name: Capture plugin doctor output
        if: env.OPENCLAW_HOST_CRASH != '1'
        env:
          OPENCLAW_HOME: ${{ github.workspace }}/.tmp-openclaw-home
        run: |
          npx --yes openclaw@latest plugins doctor > plugin-doctor.txt
          cat plugin-doctor.txt
          node -e 'const fs=require("node:fs"); const text=fs.readFileSync("plugin-doctor.txt","utf8"); if (/legacy before_agent_start|unknown typed hook/i.test(text)) throw new Error(`plugin doctor reported legacy compatibility warnings:\n${text}`);'

      - name: Note skipped runtime assertions when host crashes
        if: env.OPENCLAW_HOST_CRASH == '1'
        run: |
          echo "Skipped inspect/hooks/doctor checks because openclaw@latest crashed loading its own bundled plugins (@buape/carbon missing). Packaging and extraction checks still passed."
